apiVersion: apps/v1
kind: Deployment
metadata:
  name: muraliportfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: muraliportfolio
  template:
    metadata:
      labels:
        app: muraliportfolio
    spec:
      containers:
      - name: muraliportfolio
        image: ${DOCKER_IMAGE}
        ports:
        - containerPort: 80