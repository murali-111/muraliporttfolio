name: Build, Push and Deploy to AKS

on:
  push:
    branches:
      - Murali_New_Branch_for_Test

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/muraliportfolio:latest

      # Login to Azure
      - name: Azure Login
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail

          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "$AZURE_CREDENTIALS" > /tmp/azure-creds.json
            CLIENT_ID=$(python - <<'PY'
import json
with open('/tmp/azure-creds.json', 'r', encoding='utf-8') as fh:
    data = json.load(fh)
print(data.get('clientId', ''))
PY
)
            TENANT_ID=$(python - <<'PY'
import json
with open('/tmp/azure-creds.json', 'r', encoding='utf-8') as fh:
    data = json.load(fh)
print(data.get('tenantId', ''))
PY
)
            CLIENT_SECRET=$(python - <<'PY'
import json
with open('/tmp/azure-creds.json', 'r', encoding='utf-8') as fh:
    data = json.load(fh)
print(data.get('clientSecret', ''))
PY
)
            SUBSCRIPTION_ID=$(python - <<'PY'
import json
with open('/tmp/azure-creds.json', 'r', encoding='utf-8') as fh:
    data = json.load(fh)
print(data.get('subscriptionId', ''))
PY
)
          else
            CLIENT_ID="${AZURE_CLIENT_ID:-}"
            TENANT_ID="${AZURE_TENANT_ID:-}"
            CLIENT_SECRET="${AZURE_CLIENT_SECRET:-}"
            SUBSCRIPTION_ID="${AZURE_SUBSCRIPTION_ID:-}"
          fi

          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$SUBSCRIPTION_ID" ]; then
            echo "::error::Missing Azure credentials. Set either AZURE_CREDENTIALS or the individual Azure service principal secrets."
            exit 1
          fi

          az login --service-principal --username "$CLIENT_ID" --password "$CLIENT_SECRET" --tenant "$TENANT_ID" --allow-no-subscriptions
          az account set --subscription "$SUBSCRIPTION_ID"
          az account show --output table

      # Install kubelogin for AKS AAD auth
      - name: Install kubelogin
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base unzip
          curl -L https://github.com/Azure/kubelogin/releases/download/v0.1.7/kubelogin-linux-amd64.zip -o /tmp/kubelogin.zip
          rm -rf /tmp/kubelogin
          mkdir -p /tmp/kubelogin
          unzip /tmp/kubelogin.zip -d /tmp/kubelogin
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/kubelogin/bin/linux_amd64/kubelogin "$HOME/.local/bin/kubelogin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          kubelogin --version

      # Connect to AKS
      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      # Deploy to AKS
      - name: Deploy Application
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/muraliportfolio:latest
        run: |
          envsubst < K8s/deployment.yaml > /tmp/deployment.yaml
          kubectl apply -f /tmp/deployment.yaml
          kubectl apply -f K8s/service.yaml

      # Restart Deployment
      - name: Restart Deployment
        run: |
          kubectl rollout restart deployment/muraliportfolio

      # Verify Deployment
      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get svc

